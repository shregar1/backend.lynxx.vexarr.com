steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f=Dockerfile.billing-only'
      - '-t=us-central1-docker.pkg.dev/vexarr-com-495315/lynxx/lynxx-billing:fixed-webhook'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
    timeout: 1800s
options:
  machineType: 'E2_HIGHCPU_8'
timeout: 1800s
images:
  - 'us-central1-docker.pkg.dev/vexarr-com-495315/lynxx/lynxx-billing:fixed-webhook'
