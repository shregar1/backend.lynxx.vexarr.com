# Auto-provision the bundled Lynxx dashboard from disk.
# Files are mounted at /var/lib/grafana/dashboards by docker-compose.

apiVersion: 1

providers:
  - name: lynxx
    orgId: 1
    folder: "Lynxx"
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
