---
apiVersion: v1
kind: Namespace
metadata:
  name: lynxx-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynxx-gateway
  namespace: lynxx-system
  labels:
    app: lynxx-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lynxx-gateway
  template:
    metadata:
      labels:
        app: lynxx-gateway
    spec:
      containers:
        - name: gateway
          image: lynxx-gateway:dev
          imagePullPolicy: IfNotPresent
          command: ["lynxx-gateway"]
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 9001
          env:
            - name: RUST_LOG
              value: "info"
            - name: FLUXX_OTEL_ENDPOINT
              value: "http://localhost:4318"
            - name: OTEL_SERVICE_NAME
              value: "lynxx-gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production"
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lynxx-gateway
  namespace: lynxx-system
spec:
  selector:
    app: lynxx-gateway
  ports:
    - name: proxy
      port: 80
      targetPort: proxy
    - name: admin
      port: 9001
      targetPort: admin
  type: ClusterIP
