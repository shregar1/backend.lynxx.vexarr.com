---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lynxx-ingress
  namespace: lynxx-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lynxx-ingress
rules:
  - apiGroups: ["lynxx.dev"]
    resources: ["lynxxservices", "lynxxroutes", "lynxxplugins"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["lynxx.dev"]
    resources: ["lynxxservices/status", "lynxxroutes/status", "lynxxplugins/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lynxx-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lynxx-ingress
subjects:
  - kind: ServiceAccount
    name: lynxx-ingress
    namespace: lynxx-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynxx-ingress
  namespace: lynxx-system
  labels:
    app: lynxx-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lynxx-ingress
  template:
    metadata:
      labels:
        app: lynxx-ingress
    spec:
      serviceAccountName: lynxx-ingress
      containers:
        - name: controller
          image: lynxx-ingress:dev
          imagePullPolicy: IfNotPresent
          command: ["lynxx-ingress"]
          env:
            - name: LYNXX_ADMIN_URL
              value: "http://lynx-gateway.lynxx-system.svc.cluster.local:9001"
            - name: RUST_LOG
              value: "info,lynxx_ingress=debug"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
