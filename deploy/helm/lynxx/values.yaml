image:
  gateway: lynxx-gateway
  controller: lynxx-ingress
  tag: latest
  pullPolicy: IfNotPresent

gateway:
  replicas: 2
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  service:
    type: ClusterIP

controller:
  replicas: 1
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"

postgres:
  enabled: true       # set false to bring your own
  image: postgres:16-alpine
  storage: 1Gi
  credentials:
    user: lynxx
    password: lynxx     # override in production — see NOTES.txt
    database: lynxx

config:
  proxyPort: 9000
  adminPort: 9001
  healthCheckIntervalMs: 10000
  seedFromConfig: false
