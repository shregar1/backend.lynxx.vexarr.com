apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lynxx.configMapName" . }}
  labels:
    {{- include "lynxx.labels" . | nindent 4 }}
data:
  config.toml: |
    [gateway]
    proxy_port = {{ .Values.config.proxyPort }}
    admin_port = {{ .Values.config.adminPort }}
    # database_url is overridden at runtime via the DATABASE_URL env var
    # sourced from the {{ include "lynxx.secretName" . }} Secret.
    database_url = "sqlite://lynxx.db?mode=rwc"
    seed_from_config = {{ .Values.config.seedFromConfig }}
    health_check_interval_ms = {{ .Values.config.healthCheckIntervalMs }}
