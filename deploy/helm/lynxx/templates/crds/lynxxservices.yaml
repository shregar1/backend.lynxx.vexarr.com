apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lynxxservices.lynxx.dev
spec:
  group: lynxx.dev
  names:
    kind: LynxxService
    plural: lynxxservices
    singular: lynxxservice
    shortNames:
      - lsvc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: LynxxService — an upstream service definition.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                lbStrategy:
                  type: string
                  nullable: true
                retries:
                  type: integer
                  format: uint32
                  minimum: 0
                  default: 3
                connectTimeoutMs:
                  type: integer
                  format: uint64
                  minimum: 0
                  default: 5000
                targets:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                      weight:
                        type: integer
                        format: uint32
                        minimum: 0
                        default: 1
