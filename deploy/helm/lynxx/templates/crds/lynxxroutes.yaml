apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lynxxroutes.lynxx.dev
spec:
  group: lynxx.dev
  names:
    kind: LynxxRoute
    plural: lynxxroutes
    singular: lynxxroute
    shortNames:
      - lrt
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: LynxxRoute — a path/method match binding to a LynxxService.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [paths, serviceRef]
              properties:
                paths:
                  type: array
                  items:
                    type: string
                methods:
                  type: array
                  default: []
                  items:
                    type: string
                serviceRef:
                  type: string
                  description: Name of the LynxxService in the same namespace.
                stripPath:
                  type: boolean
                  default: false
