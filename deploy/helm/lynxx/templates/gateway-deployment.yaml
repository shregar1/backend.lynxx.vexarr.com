apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lynxx.gatewayName" . }}
  labels:
    {{- include "lynxx.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "lynxx.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: {{ .Values.config.proxyPort }}
            - name: admin
              containerPort: {{ .Values.config.adminPort }}
          env:
            - name: LYNXX_CONFIG
              value: /etc/lynxx/config.toml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "lynxx.secretName" . }}
                  key: DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /etc/lynxx/config.toml
              subPath: config.toml
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "lynxx.configMapName" . }}
