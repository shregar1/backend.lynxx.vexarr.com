apiVersion: v1
kind: Service
metadata:
  name: {{ include "lynxx.gatewayName" . }}
  labels:
    {{- include "lynxx.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: proxy
      port: {{ .Values.config.proxyPort }}
      targetPort: proxy
    - name: admin
      port: {{ .Values.config.adminPort }}
      targetPort: admin
