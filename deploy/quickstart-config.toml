# Lynxx quickstart config — single-node SQLite mode.
#
# This is the minimal config for a working gateway. Add services and
# routes via the admin API (port 28081) or the CLI (`lynxx`).

[gateway]
proxy_port = 28080
admin_port = 28081
# SQLite — no Postgres required. Data lives in /var/lib/lynxx/.
database_url = "sqlite:///var/lib/lynxx/lynxx.db?mode=rwc"
seed_from_config = false

# Uncomment to enable automatic Let's Encrypt certificates.
# The gateway must be reachable on port 80 for HTTP-01 challenges.
# [gateway.acme]
# enabled = true
# domains = ["gateway.example.com"]
# email = "you@example.com"
# storage_dir = "/var/lib/lynxx/acme"
# self_signed = false

# Uncomment to enable TLS with pre-provisioned certs.
# [gateway.tls]
# enabled = true
# cert_path = "/etc/lynxx/tls/cert.pem"
# key_path = "/etc/lynxx/tls/key.pem"
