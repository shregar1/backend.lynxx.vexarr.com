# nginx — TLS terminator and L7 round-robin in front of three Lynxx gateways.
#
# Replace the self-signed cert in ./certs/ with your real one and reload:
#   docker compose exec nginx nginx -s reload

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # ---- Logging --------------------------------------------------------
    log_format lynxx '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time '
                     'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log lynxx;
    error_log  /var/log/nginx/error.log  warn;

    # ---- Tuning ---------------------------------------------------------
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    server_tokens        off;
    keepalive_timeout    75s;
    keepalive_requests   1000;
    types_hash_max_size  4096;
    client_max_body_size 16m;

    # gzip is fine for the admin API; the data plane carries application
    # payloads we don't want to recompress.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types         application/json text/plain text/css application/javascript;

    # ---- Upstream pool --------------------------------------------------
    # Three gateway replicas. `least_conn` would also work; round-robin is
    # stable enough for the typical short-request workload.
    upstream lynxx {
        server lynxx-gateway-1:9000 max_fails=3 fail_timeout=10s;
        server lynxx-gateway-2:9000 max_fails=3 fail_timeout=10s;
        server lynxx-gateway-3:9000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ---- TLS settings ---------------------------------------------------
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1h;
    ssl_session_tickets        off;
    # OCSP stapling — turn on once you have a real cert.
    # ssl_stapling             on;
    # ssl_stapling_verify      on;

    # ---- Plain HTTP -> redirect to HTTPS, plus healthz on :80 ----------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS edge -----------------------------------------------------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        # Self-signed by default. Drop your real cert + key in ./certs/.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # HSTS — only enable once your domain is fully on HTTPS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Lightweight liveness for upstream health checkers.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            default_type text/plain;
        }

        # Everything else proxies to the gateway pool.
        location / {
            proxy_pass         http://lynxx;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            # Forward upgrade requests for websockets.
            proxy_set_header Upgrade $http_upgrade;
            # Only switch protocols when the client actually asked.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Don't buffer responses — the gateway streams.
            proxy_buffering    off;
            proxy_request_buffering off;

            # Retry once on the next upstream when a node is down.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
