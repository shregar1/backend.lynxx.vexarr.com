services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lynxx
      POSTGRES_PASSWORD: lynxx
      POSTGRES_DB: lynxx
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lynxx"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - lynxx-pg-data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      target: gateway
    environment:
      LYNXX_CONFIG: /etc/lynxx/config.toml
      LYNXX_PROXY_PORT: ${LYNXX_PROXY_PORT:-28080}
      LYNXX_ADMIN_PORT: ${LYNXX_ADMIN_PORT:-28081}
      DATABASE_URL: postgres://lynxx:lynxx@postgres:5432/lynxx
      # Fluxx telemetry (OTel → local agent); remove to disable.
      FLUXX_OTEL_ENDPOINT: http://127.0.0.1:4318
      OTEL_SERVICE_NAME: lynxx-gateway
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
    ports:
      - "${LYNXX_PROXY_PORT:-28080}:${LYNXX_PROXY_PORT:-28080}"
      - "${LYNXX_ADMIN_PORT:-28081}:${LYNXX_ADMIN_PORT:-28081}"
    depends_on:
      postgres:
        condition: service_healthy

  gateway-2:
    # second node for clustering demo
    build:
      context: .
      target: gateway
    environment:
      LYNXX_CONFIG: /etc/lynxx/config.toml
      LYNXX_PROXY_PORT: ${LYNXX_PROXY_PORT:-28080}
      LYNXX_ADMIN_PORT: ${LYNXX_ADMIN_PORT:-28081}
      DATABASE_URL: postgres://lynxx:lynxx@postgres:5432/lynxx
      FLUXX_OTEL_ENDPOINT: http://127.0.0.1:4318
      OTEL_SERVICE_NAME: lynxx-gateway
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
    ports:
      - "28180:${LYNXX_PROXY_PORT:-28080}"
      - "28181:${LYNXX_ADMIN_PORT:-28081}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lynxx-pg-data:
