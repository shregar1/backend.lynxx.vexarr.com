name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            bench/target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      # NOTE: existing codebase has a number of style-level lints; we keep
      # clippy enabled but do NOT fail on warnings here. TODO: tighten to
      # `-D warnings` once the backlog is cleaned up.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps

  test-sqlite:
    name: test (sqlite)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            bench/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: cargo test (sqlite)
        run: cargo test --workspace --all-targets

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lynxx
          POSTGRES_PASSWORD: lynxx
          POSTGRES_DB: lynxx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynxx"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://lynxx:lynxx@localhost:5432/lynxx
      LYNXX_TEST_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pg-
      - name: cargo test (postgres)
        run: cargo test --workspace --all-targets

  build-binaries:
    name: build release binaries
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: cargo build --release
        run: cargo build --release --bin lynx-gateway --bin lynxx-ingress

      - name: cargo build --release (bench)
        run: cargo build --release -p lynxx-bench

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lynxx-${{ github.ref_name }}-linux-amd64
          path: |
            target/release/lynx-gateway
            target/release/lynxx-ingress
            target/release/lynxx-bench
          if-no-files-found: error

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker buildx (gateway)
        run: docker buildx build --target gateway -t lynxx-gateway:ci --load .
      - name: docker buildx (ingress)
        run: docker buildx build --target ingress -t lynxx-ingress:ci --load .

  bench-smoke:
    name: bench smoke (optional)
    runs-on: ubuntu-latest
    needs: build-binaries
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: build gateway + bench
        run: cargo build --release --bin lynx-gateway && cargo build --release -p lynxx-bench

      - name: Start static upstream (python http.server)
        run: |
          mkdir -p /tmp/upstream && echo ok > /tmp/upstream/index.html
          (cd /tmp/upstream && nohup python3 -m http.server 18080 >/tmp/upstream.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/ && break || sleep 1
          done

      - name: Write smoke config
        run: |
          cat > /tmp/lynxx-smoke.toml <<'EOF'
          [gateway]
          proxy_port = 9000
          admin_port = 9001
          database_url = "sqlite:///tmp/lynxx-smoke.db?mode=rwc"
          seed_from_config = true
          health_check_interval_ms = 60000
          health_circuit_failure_threshold = 3
          health_circuit_success_threshold = 2
          health_circuit_open_duration_ms = 30000

          [[services]]
          name = "smoke"
          url = "http://127.0.0.1:18080"

          [[routes]]
          paths = ["/smoke"]
          methods = ["GET"]
          service = "smoke"
          strip_path = true
          EOF

      - name: Start gateway in background
        run: |
          LYNXX_CONFIG=/tmp/lynxx-smoke.toml \
            nohup ./target/release/lynx-gateway >/tmp/gw.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9001/status && break || sleep 1
          done

      - name: Run bench smoke
        run: |
          ./target/release/lynxx-bench \
            --target http://127.0.0.1:9000/smoke \
            --rps 1000 --duration-secs 5 --connections 32 \
            | tee /tmp/bench.out
          # Trivial assertion: at least some measured requests, no all-error run.
          grep -E "achieved_rps:" /tmp/bench.out

      - name: Tail logs on failure
        if: failure()
        run: |
          echo "===== gateway log =====" && tail -200 /tmp/gw.log || true
          echo "===== upstream log =====" && tail -200 /tmp/upstream.log || true
