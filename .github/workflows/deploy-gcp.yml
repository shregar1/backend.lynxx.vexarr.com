name: Deploy to GCP

# Manual-only. Run from the Actions tab or `gh workflow run deploy-gcp.yml`.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: [prod, staging]
      deploy_gateway_to_gke:
        description: 'Also deploy the gateway to GKE (Helm). Off by default — billing service goes through Cloud Run only.'
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID:   ${{ vars.GCP_PROJECT_ID }}
  REGION:       ${{ vars.GCP_REGION || 'us-central1' }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'lynxx-cluster' }}
  REGISTRY:     ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lynxx

jobs:
  # -------------------------------------------------------------------------
  # 1. Build and push all container images to Artifact Registry
  # -------------------------------------------------------------------------
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/lynxx-gateway:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/lynxx-gateway:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/lynxx-gateway:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/lynxx-gateway:buildcache,mode=max
          platforms: linux/amd64

      - name: Build & push ingress controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: ingress
          push: true
          tags: |
            ${{ env.REGISTRY }}/lynxx-ingress:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/lynxx-ingress:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/lynxx-ingress:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/lynxx-ingress:buildcache,mode=max
          platforms: linux/amd64

      - name: Build & push billing service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: billing
          push: true
          tags: |
            ${{ env.REGISTRY }}/lynxx-billing:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/lynxx-billing:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/lynxx-billing:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/lynxx-billing:buildcache,mode=max
          platforms: linux/amd64

      - name: Deploy billing to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lynxx-billing
          region:  ${{ env.REGION }}
          image:   ${{ env.REGISTRY }}/lynxx-billing:${{ steps.meta.outputs.tag }}

  # -------------------------------------------------------------------------
  # 2. Build and deploy website + dashboard to Cloud Run
  # -------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontends to Cloud Run
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/website.lynxx.dev
          token: ${{ secrets.GH_PAT }}
          path: website

      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/node.dashboard.lynxx.dev
          token: ${{ secrets.GH_PAT }}
          path: dashboard

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push website
        uses: docker/build-push-action@v5
        with:
          context: website
          push: true
          tags: |
            ${{ env.REGISTRY }}/lynxx-website:${{ needs.build-push.outputs.image_tag }}
            ${{ env.REGISTRY }}/lynxx-website:latest
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_STRIPE_PRO_PRICE_ID=${{ secrets.VITE_STRIPE_PRO_PRICE_ID }}
            VITE_STRIPE_BUSINESS_PRICE_ID=${{ secrets.VITE_STRIPE_BUSINESS_PRICE_ID }}
            VITE_BILLING_API_URL=${{ vars.VITE_BILLING_API_URL }}

      - name: Build & push dashboard
        uses: docker/build-push-action@v5
        with:
          context: dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/lynxx-dashboard:${{ needs.build-push.outputs.image_tag }}
            ${{ env.REGISTRY }}/lynxx-dashboard:latest
          build-args: |
            VITE_GATEWAY_API_URL=${{ vars.VITE_GATEWAY_API_URL }}
            VITE_GATEWAY_ADMIN_URL=${{ vars.VITE_GATEWAY_ADMIN_URL }}

      - name: Deploy website to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lynxx-website
          region:  ${{ env.REGION }}
          image:   ${{ env.REGISTRY }}/lynxx-website:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy dashboard to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lynxx-dashboard
          region:  ${{ env.REGION }}
          image:   ${{ env.REGISTRY }}/lynxx-dashboard:${{ needs.build-push.outputs.image_tag }}

  # -------------------------------------------------------------------------
  # 3. Deploy gateway to GKE via Helm
  # -------------------------------------------------------------------------
  deploy-gateway:
    name: Deploy gateway to GKE
    runs-on: ubuntu-latest
    needs: build-push
    # Off by default — only runs when the workflow is dispatched with
    # deploy_gateway_to_gke=true. Saves ~5min per deploy when only the
    # billing service is being shipped.
    if: ${{ github.event.inputs.deploy_gateway_to_gke == 'true' }}
    environment: ${{ github.event.inputs.environment || 'prod' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location:     ${{ env.REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14'

      - name: Ensure namespace + Workload Identity service account
        run: |
          kubectl create namespace lynxx-system --dry-run=client -o yaml | kubectl apply -f -

          # Create the K8s ServiceAccount with the Workload Identity annotation
          kubectl create serviceaccount lynxx-gateway -n lynxx-system --dry-run=client -o yaml \
            | kubectl annotate --local --overwrite -f - \
                iam.gke.io/gcp-service-account=lynxx-gateway@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
                -o yaml \
            | kubectl apply -f -

      - name: Create DB secret
        run: |
          # DATABASE_URL points to localhost (Cloud SQL Auth Proxy in sidecar)
          kubectl create secret generic lynxx-secret \
            --from-literal=DATABASE_URL="postgres://lynxx:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/lynxx" \
            -n lynxx-system \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm deploy
        run: |
          SQL_CONN="${{ vars.SQL_CONNECTION_NAME }}"  # e.g. my-project:us-central1:lynxx-postgres-abc123

          helm upgrade --install lynxx ./deploy/helm/lynxx \
            --namespace lynxx-system \
            --values deploy/gcp/values.yaml \
            --set image.tag=${{ needs.build-push.outputs.image_tag }} \
            --set "image.gateway=${{ env.REGISTRY }}/lynxx-gateway" \
            --set "image.controller=${{ env.REGISTRY }}/lynxx-ingress" \
            --set "gateway.extraContainers[0].args[1]=${SQL_CONN}" \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/lynxx-gateway -n lynxx-system --timeout=3m
          kubectl get pods -n lynxx-system
