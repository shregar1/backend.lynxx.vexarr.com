name: release

# Triggered on annotated `v*` tags. Produces:
#   1. Cross-platform release tarballs (linux x86_64/aarch64, darwin x86_64/aarch64,
#      windows x86_64) attached to a GitHub Release.
#   2. SHA256SUMS for every artifact.
#   3. Multi-arch Docker images for gateway/ingress/cli pushed to GHCR.
#
# The release body is taken from the tag's annotated message.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write    # create release + upload assets
  packages: write    # push to ghcr.io

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform binary builds.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.target }}-

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} \
            --bin lynx-gateway --bin lynxx-ingress --bin lynxx

      - name: Build (cargo)
        if: '!matrix.use_cross'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin lynx-gateway --bin lynxx-ingress --bin lynxx

      - name: Stage artifact tree
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="lynxx-${version}-${target}"
          stage="dist/${name}"
          mkdir -p "${stage}/migrations"

          if [[ "${target}" == *windows* ]]; then
            cp "target/${target}/release/lynx-gateway.exe"  "${stage}/"
            cp "target/${target}/release/lynxx-ingress.exe" "${stage}/"
            cp "target/${target}/release/lynxx.exe"         "${stage}/"
          else
            cp "target/${target}/release/lynx-gateway"  "${stage}/"
            cp "target/${target}/release/lynxx-ingress" "${stage}/"
            cp "target/${target}/release/lynxx"         "${stage}/"
            chmod +x "${stage}"/lynx-gateway "${stage}"/lynxx-ingress "${stage}"/lynxx
          fi

          [[ -f LICENSE ]] && cp LICENSE "${stage}/" || echo "no LICENSE file" > "${stage}/LICENSE"
          cp README.md "${stage}/"
          cp -R migrations/. "${stage}/migrations/"

          echo "name=${name}"   >> "$GITHUB_OUTPUT"
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf "${{ steps.stage.outputs.name }}.tar.gz" "${{ steps.stage.outputs.name }}"
          shasum -a 256 "${{ steps.stage.outputs.name }}.tar.gz" \
            > "${{ steps.stage.outputs.name }}.tar.gz.sha256"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path "${{ steps.stage.outputs.name }}" `
            -DestinationPath "${{ steps.stage.outputs.name }}.zip"
          $hash = (Get-FileHash "${{ steps.stage.outputs.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ steps.stage.outputs.name }}.zip" | `
            Out-File -Encoding ascii "${{ steps.stage.outputs.name }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynxx-${{ matrix.target }}
          path: |
            dist/lynxx-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/lynxx-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Aggregate, sign, and publish the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need annotated tag body

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lynxx-*
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS
          for f in *.tar.gz *.zip; do
            [[ -f "$f" ]] || continue
            shasum -a 256 "$f" >> SHA256SUMS
          done
          rm -f *.sha256
          cat SHA256SUMS

      - name: Extract tag message
        id: tagmsg
        run: |
          set -euo pipefail
          # Annotated tag body: skip the headers, keep the message.
          body=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [[ -z "${body// }" ]]; then
            body="Release ${GITHUB_REF_NAME}."
          fi
          {
            echo 'body<<__EOF__'
            echo "${body}"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.tagmsg.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Multi-arch Docker images → ghcr.io/<owner>/lynxx-{gateway,ingress,cli}.
  # ---------------------------------------------------------------------------
  docker:
    name: docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lynxx-gateway
            target: gateway
          - image: lynxx-ingress
            target: ingress
          - image: lynxx-cli
            target: cli
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false
